version: '3.8'

services:
  # Nginx Reverse Proxy & SSL Gateway
  nginx:
    image: nginx:alpine
    container_name: dawareminder-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # Frontend React + Vite + PWA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dawareminder-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

  # Backend FastAPI Application Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dawareminder-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:dawa_secure_pass@postgres:5432/dawareminder_db
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=dawa_minio_admin
      - S3_SECRET_KEY=dawa_minio_secret_key_123
      - S3_BUCKET_NAME=dawareminder-vault
      - SECRET_KEY=super_secret_dev_jwt_key_please_change_in_production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # Celery Background Worker (Dose Generator, Escalations & OCR)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dawareminder-celery-worker
    command: celery -A app.core.celery_app worker --loglevel=info -c 4
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:dawa_secure_pass@postgres:5432/dawareminder_db
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=dawa_minio_admin
      - S3_SECRET_KEY=dawa_minio_secret_key_123
      - S3_BUCKET_NAME=dawareminder-vault
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # Celery Beat (Periodic 7-day rolling window & overdue checker)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dawareminder-celery-beat
    command: celery -A app.core.celery_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: dawareminder-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=dawa_secure_pass
      - POSTGRES_DB=dawareminder_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis 7 In-Memory Broker & Cache
  redis:
    image: redis:7-alpine
    container_name: dawareminder-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # MinIO S3-Compatible Local Object Store
  minio:
    image: minio/minio:latest
    container_name: dawareminder-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=dawa_minio_admin
      - MINIO_ROOT_PASSWORD=dawa_minio_secret_key_123
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
