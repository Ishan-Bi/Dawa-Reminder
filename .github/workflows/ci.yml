name: DawaReminder CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Lint, Type-Check & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dawa_secure_pass
          POSTGRES_DB: dawareminder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:dawa_secure_pass@localhost:5432/dawareminder_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_ci_only
        run: |
          if [ -d backend/tests ] && find backend/tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            pytest -v backend/tests/ --maxfail=1
          else
            echo "No backend test files found; skipping pytest until tests are added."
          fi

  frontend-tests:
    name: Frontend Lint & Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Unit Tests & Accessibility Audits
        working-directory: ./frontend
        run: npm run test:ci
